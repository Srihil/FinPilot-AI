<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#g)"/>
  <!-- Three ascending bars -->
  <rect x="12" y="57" width="21" height="31" rx="5" fill="white"/>
  <rect x="40" y="39" width="21" height="49" rx="5" fill="white"/>
  <rect x="68" y="18" width="21" height="70" rx="5" fill="white"/>
  <!-- Trend line connecting bar tops -->
  <polyline points="22.5,57 50.5,39 78.5,18"
    stroke="white" stroke-width="3.5" fill="none"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <!-- Dot at trend peak -->
  <circle cx="78.5" cy="18" r="5" fill="white" opacity="0.9"/>
</svg>
