databases:
  - name: finpilot-db
    databaseName: finpilot_db
    user: finpilot
    plan: free
    region: oregon

services:
  # ── Backend API (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    name: finpilot-backend
    plan: free
    region: oregon
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: AI_PROVIDER
        value: demo
      - key: DEMO_MODE
        value: "true"
      # Update this after you know the frontend URL
      - key: CORS_ORIGINS
        value: https://finpilot-frontend.onrender.com
      - key: APP_ENV
        value: production
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: TALLY_ENABLED
        value: "false"

  # ── Frontend (React Static Site) ─────────────────────────────────────────────
  - type: web
    name: finpilot-frontend
    plan: free
    region: oregon
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Must match the backend service name above
      - key: VITE_API_URL
        value: https://finpilot-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
